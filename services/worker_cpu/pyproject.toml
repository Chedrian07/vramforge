[project]
name = "vramforge-worker"
version = "0.1.0"
description = "VRAMForge CPU worker: runs full-dataset analyses from the RQ queue"
requires-python = ">=3.12,<3.14"
dependencies = [
    "vramforge-api",
    "vramforge-estimator[analysis]",
    "rq>=2.12",
]

[project.scripts]
vramforge-worker = "vramforge_worker.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vramforge_worker"]
