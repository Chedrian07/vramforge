[project]
name = "vramforge"
version = "0.1.0"
description = "VRAMForge workspace root: fine-tuning VRAM calculator"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "vramforge-estimator[analysis]",
    "vramforge-api",
    "vramforge-worker",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/estimator", "services/api", "services/worker_cpu"]

[tool.uv.sources]
vramforge-estimator = { workspace = true }
vramforge-api = { workspace = true }
vramforge-worker = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-timeout>=2.3",
    "ruff>=0.16",
    "mypy>=2.4",
    "fakeredis>=2.39",
    "httpx>=0.28",
    "types-PyYAML>=6.0",
]
# Real TRL/torch stack used ONLY by tests/preprocessing_parity (never installed in Docker images).
parity = [
    "trl==1.14.1",
    "torch==2.14.1",
    "peft==0.21.2",
    "accelerate==1.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "parity: compares against the real TRL trainers (requires the 'parity' dependency group)",
    "network: requires network access to the Hugging Face Hub",
    "slow: long-running test",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "**/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["vramforge_estimator", "vramforge_api", "vramforge_worker"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
