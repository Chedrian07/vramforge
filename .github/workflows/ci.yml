# VRAMForge CI (docs/goals.md M0-5, Q5).
#   python  ruff lint + format check, .env.example/compose consistency, compose contract and
#           helper script tests (infra/tests), pytest (no network)
#   web     pnpm install --frozen-lockfile, lint, typecheck, test, build (apps/web)
#   docker  zero-.env compose config, build, up --wait, smoke test, one offline full analysis
#           through the proxy (tiny fixtures, no GPU, no Hugging Face), down -v
#           on linux/amd64 and linux/arm64 runners
# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same uv release as the Docker build (infra/docker/python.Dockerfile, UV_IMAGE).
  UV_VERSION: "0.12.23"
  # Same Node.js release as the web image (infra/docker/web.Dockerfile, NODE_IMAGE).
  NODE_VERSION: "24.21.0"

jobs:
  python:
    name: python (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Docker images and this job install uv.lock with --frozen, which never notices a stale lock.
      - name: uv.lock is up to date with every pyproject.toml
        run: uv lock --check

      - name: Install the workspace with every group (frozen lockfile)
        run: uv sync --all-groups --frozen

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check (Python sources only)
        run: uv run --no-sync ruff format --check --extend-exclude '*.md' .

      - name: .env.example documents every compose variable
        run: uv run --no-sync python infra/scripts/check_env_example.py

      # infra/tests is outside the default testpaths (tests/), so it runs as its own step.
      - name: Compose contract and infra helper script tests
        run: uv run --no-sync pytest infra/tests -q

      - name: Pytest (network tests skip without VRAMFORGE_NETWORK_TESTS=1)
        run: uv run --no-sync pytest -q

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # pnpm comes from corepack at the version pinned by package.json "packageManager".
      - name: Enable pnpm through corepack
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  docker:
    name: docker compose (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Native linux/amd64 and linux/arm64 runners: both architectures build and boot the stack.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # Docker Hub rate-limits anonymous pulls from shared runner IPs. mirror.gcr.io serves the same
      # pinned tags with identical digests (docs/research/stack-compat.md §7.2, §7.5); this also
      # exercises the *_IMAGE override path documented in docs/deployment.md.
      PYTHON_IMAGE: mirror.gcr.io/library/python:3.12.15-slim-trixie
      NODE_IMAGE: mirror.gcr.io/library/node:24.21.0-trixie-slim
      CADDY_IMAGE: mirror.gcr.io/library/caddy:2.11.6-alpine
      POSTGRES_IMAGE: mirror.gcr.io/library/postgres:18.6-alpine
      REDIS_IMAGE: mirror.gcr.io/library/redis:8.10.2-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          docker version
          docker compose version
          docker buildx version

      - name: Compose config resolves with an empty environment and no .env
        run: |
          test ! -e .env
          env -i PATH="$PATH" HOME="$HOME" docker compose config -q

      - name: Build every service
        run: docker compose build

      - name: Prepare offline local sources (tiny model and dataset from tests/fixtures)
        run: python3 infra/scripts/analysis_smoke.py prepare "$RUNNER_TEMP/local-sources"

      - name: Start the stack and wait until every service is healthy
        env:
          VRAMFORGE_LOCAL_SOURCES_DIR: ${{ runner.temp }}/local-sources
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test through the proxy
        run: sh infra/scripts/smoke-test.sh http://127.0.0.1:8080

      - name: Full analysis through the proxy without a GPU (plan.md §19.4)
        run: python3 infra/scripts/analysis_smoke.py run http://127.0.0.1:8080

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down this project (containers, networks, volumes)
        if: always()
        run: docker compose down -v --remove-orphans
