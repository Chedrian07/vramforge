# VRAMForge self-hosted stack.
#
#   docker compose up -d --build        ->  http://localhost:8080
#
# Works without a GPU and without a .env file: every variable has a "${VAR:-default}" fallback
# or is optional (value-less pass-through). All of them are documented in .env.example and
# docs/deployment.md. Only the proxy publishes a port, bound to 127.0.0.1 by default
# (plan.md §18). Layout: docs/architecture.md §1.
# Pinned versions and healthchecks: docs/research/stack-compat.md §7, §10.7-10.8.

name: vramforge

x-python-build: &python-build
  context: .
  dockerfile: infra/docker/python.Dockerfile
  args:
    PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.15-slim-trixie}
    UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.23}

# Settings read by vramforge-api and vramforge-worker (services/api/.../settings.py).
# Value-less entries are passed through only when set in the shell or .env. Unset, they are
# absent in the container: no empty token, and the API's own defaults apply.
# Each secret goes only to the services that use it (plan.md §18): migrate gets the database URL
# alone, HF_TOKEN reaches api and worker, VRAMFORGE_ACCESS_TOKEN reaches the api only.
# HF_TOKEN is used for source access only with VRAMFORGE_SHARE_SERVER_HF_TOKEN=true
# (single-user deployments; the service account must not stand in for users' access).
x-db-env: &db-env
  VRAMFORGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vramforge}:${POSTGRES_PASSWORD:-vramforge}@postgres:5432/${POSTGRES_DB:-vramforge}
  VRAMFORGE_LOG_LEVEL:

x-worker-env: &worker-env
  <<: *db-env
  VRAMFORGE_REDIS_URL: redis://redis:6379/0
  VRAMFORGE_DATA_DIR: /data
  VRAMFORGE_LOCAL_ROOTS: ${VRAMFORGE_LOCAL_ROOTS:-local=/sources/local}
  HF_TOKEN:
  VRAMFORGE_SHARE_SERVER_HF_TOKEN: ${VRAMFORGE_SHARE_SERVER_HF_TOKEN:-false}
  VRAMFORGE_MAX_UPLOAD_BYTES:
  VRAMFORGE_MAX_CONCURRENT_JOBS_PER_OWNER:
  VRAMFORGE_JOB_TIMEOUT_S:
  VRAMFORGE_RETENTION_DAYS:

x-api-env: &api-env
  <<: *worker-env
  VRAMFORGE_COOKIE_SECURE: ${VRAMFORGE_COOKIE_SECURE:-false}
  VRAMFORGE_ACCESS_TOKEN:
  VRAMFORGE_MAX_UPLOAD_BYTES_PER_OWNER:

x-app-volumes: &app-volumes
  - vfdata:/data
  - ${VRAMFORGE_LOCAL_SOURCES_DIR:-./local-sources}:/sources/local:ro

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  proxy:
    <<: *hardening
    build:
      context: infra/proxy
      dockerfile: ../docker/proxy.Dockerfile
      args:
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2.11.6-alpine}
    ports:
      - "${VRAMFORGE_BIND:-127.0.0.1}:${VRAMFORGE_PORT:-8080}:80"
    environment:
      # API upload limit (VRAMFORGE_MAX_UPLOAD_BYTES, default 2 GiB) + 1 MiB of multipart framing.
      VRAMFORGE_PROXY_MAX_BODY_SIZE: ${VRAMFORGE_PROXY_MAX_BODY_SIZE:-2049MiB}
    read_only: true
    # The only network-facing container runs Caddy as root (to bind :80); keep only that capability.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    tmpfs:
      - /config
      - /data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    <<: *hardening
    build:
      context: apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.21.0-trixie-slim}
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  api:
    <<: *hardening
    build: *python-build
    command: ["vramforge-api"]
    init: true
    environment: *api-env
    volumes: *app-volumes
    networks: [default, backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  worker:
    <<: *hardening
    build: *python-build
    command: ["vramforge-worker"]
    init: true
    environment: *worker-env
    volumes: *app-volumes
    networks: [default, backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The check starts a Python process (~0.8 s CPU); 30 s keeps the idle cost near 2.5 % of a
    # core while staying well inside the 60 s worker TTL heartbeat window.
    healthcheck:
      test: ["CMD", "vramforge-worker", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # The first SIGTERM is an RQ warm shutdown; Docker sends SIGKILL after the grace period and
    # an interrupted analysis is recovered through its expired lease (plan.md §16.1-16.2).
    stop_grace_period: 30s
    restart: unless-stopped

  migrate:
    <<: *hardening
    build: *python-build
    command: ["vramforge-api", "migrate"]
    init: true
    environment: *db-env
    # migrate runs first and alone, so it performs the one-time copy of the image's /data layout
    # (owned by the app user) into the empty named volume. api and worker start only after it
    # exits; mounting a fresh volume in both at once races on that copy ("mkdir …: file exists").
    volumes:
      - vfdata:/data
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    <<: *hardening
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vramforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vramforge}
      POSTGRES_DB: ${POSTGRES_DB:-vramforge}
    # PostgreSQL 18 keeps PGDATA under /var/lib/postgresql/18/docker (stack-compat.md §7.3).
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]
    # -h 127.0.0.1: the init-time server listens on the unix socket only, so a TCP probe cannot
    # report healthy before the final server is up (stack-compat.md §7.3 V24).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    <<: *hardening
    image: ${REDIS_IMAGE:-redis:8.10.2-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # --- GPU validation (milestone M5) is NOT part of this release --------------------------
  # The API answers POST /api/v1/analyses/{id}/profile with 503 GPU_WORKER_UNAVAILABLE and the
  # UI shows "GPU 검증 미연결" (plan.md §17, docs/goals.md M5-0). A future GPU worker would be
  # added here behind the opt-in "gpu" profile so that the default stack never needs a GPU:
  #
  # worker_gpu:
  #   profiles: ["gpu"]
  #   build: { context: ., dockerfile: infra/docker/worker-gpu.Dockerfile }
  #   deploy:
  #     resources:
  #       reservations:
  #         devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

networks:
  default: {}
  # Data stores are reachable only from api, worker and migrate, and have no outbound access.
  backend:
    internal: true

volumes:
  pgdata: {}
  redisdata: {}
  vfdata: {}
