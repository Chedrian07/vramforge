# GPU presets offered by the calculator (plan.md §5.1 hardware.mode = gpu_preset).
# nominal_gib is the vendor's nominal memory size (binary units), so
# total_bytes = nominal_gib x 1,073,741,824. The UI also accepts custom total/usable values.
# Only compute capability >= 8.0 GPUs are listed: the analytic profiles assume bf16 autocast with
# flash/memory-efficient SDPA, and older GPUs may fall back to the O(T^2) math backend
# (docs/research/architecture-memory.md, implementation implications G).
version: "1.0.0"
note: "공칭 용량입니다. nvidia-smi가 보고하는 총량과 실제 학습에 쓸 수 있는 용량(ECC·드라이버 예약·CUDA context·다른 프로세스 제외)은 더 작으므로, 가능하면 사용 가능 용량을 직접 입력하세요."
