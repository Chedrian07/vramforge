# Training-environment profile (plan.md §11.2): the pinned CUDA + TRL 1.14.1 stack every analytic
# profile is computed for. Facts come from docs/research/*.md (VERIFIED unless noted there).
#
# dependency_lock_digest = "sha256:" + sha256 over the sorted, newline-terminated "name==version"
# lines of `packages` (PEP 503 normalized names). It is recomputed by
# vramforge_estimator.compatibility.profiles.lock_digest on load and must match this file.
id: cuda-trl-1.14.1
version: "1.0.0"
description: "단일 NVIDIA GPU, PyTorch 2.14.1 + Transformers 5.18.0 + TRL 1.14.1 학습 환경"
platform: linux-cuda
python: "3.12"
cuda: null # CUDA toolkit/driver는 아직 고정하지 않음 (GPU 보정 M5에서 고정)
packages:
  accelerate: "1.15.0"
  bitsandbytes: "0.50.2"
  datasets: "5.0.1"
  huggingface-hub: "1.33.0"
  peft: "0.21.2"
  safetensors: "0.8.0"
  tokenizers: "0.23.2"
  torch: "2.14.1"
  transformers: "5.18.0"
  trl: "1.14.1"
dependency_lock_digest: "sha256:ccd37fedde9c120a68463ded39d0925353779d48665408c54869ea67b210cc87"
kernels:
  installed: []
  absent:
    - flash-linear-attention
    - causal-conv1d
    - liger-kernel
    - flash-attn
    - kernels
    - vllm
    - pillow
    - torchvision
  # transformers selects the Gated DeltaNet kernel at import time: hub kernel -> fla package -> torch.
  # Neither fla nor causal-conv1d is installed, so CUDA also runs the torch fallback
  # (docs/research/architecture-memory.md §2.1, docs/research/trl-grpo.md §4.5).
  linear_attention: torch_fallback
  # torch 2.14.1 Linux wheels depend on triton, so TRL's fused log-prob/entropy kernel is used for
  # DPO/GRPO logits (docs/research/trl-grpo.md §6.2, verification #13).
  logprob_kernel: trl_triton_fused
  notes:
    - "liger-kernel 미설치: use_liger_kernel=True는 TRL에서 ImportError (docs/research/trl-sft-dpo.md §1.6)."
    - "Pillow/torchvision 미설치: VLM checkpoint는 processing_class로 AutoTokenizer를 명시해야 Trainer가 생성됨 (docs/research/trl-sft-dpo.md §3)."
trainer_defaults:
  # TRL 1.14.1 / transformers 5.18.0 defaults that differ from the product presets. The exporter
  # pins the product values explicitly (docs/research/trl-sft-dpo.md §1.1, §6; trl-grpo.md §1).
  gradient_checkpointing: true
  gradient_checkpointing_kwargs: { use_reentrant: false, every_n_layers: 1, offload: false }
  bf16: true
  optim: adamw_torch_fused
  model_init_dtype: float32
  device_map: auto
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  sft_loss_type: chunked_nll
  sft_max_length: 1024
  dpo_max_length: 1024
  dpo_beta: 0.1
  dpo_loss_type: [sigmoid]
  dpo_disable_dropout: true
  grpo_num_generations: 8
  grpo_max_completion_length: 512
  grpo_beta: 0.0
  grpo_num_iterations: 1
  grpo_loss_type: dapo
  dataloader_drop_last: false
trainers:
  sft:
    config_class: SFTConfig
    no_truncation:
      max_length: null
      packing: false
      eval_packing: false
      padding_free: false
      dataloader_drop_last: false
      max_steps: -1
    removed_fields: [max_seq_length, dataset_batch_size, num_of_sequences, chars_per_token]
    notes:
      - "max_length=None이면 _prepare_dataset 절단과 fully-masked row 삭제가 모두 꺼짐 (docs/research/trl-sft-dpo.md §1.2)."
      - "packing=True는 max_length 정수가 필수이고 bfd/bfd_split/wrapped 모두 엄격 무절단 계약을 위반함 (§1.3)."
  dpo:
    config_class: DPOConfig
    no_truncation:
      max_length: null
      padding_free: false
      dataloader_drop_last: false
      max_steps: -1
    removed_fields:
      - max_prompt_length
      - max_completion_length
      - use_logits_to_keep
      - model_adapter_name
      - ref_adapter_name
      - force_use_ref_model
      - label_pad_token_id
      - padding_value
      - rpo_alpha
      - reference_free
    notes:
      - "max_length=None이면 collator 절단과 prompt 길이 기반 pair 삭제가 꺼짐 (docs/research/trl-sft-dpo.md §7.3-7.4, §10.2)."
  grpo:
    config_class: GRPOConfig
    no_truncation:
      dataloader_drop_last: false
      max_steps: -1
    removed_fields: [max_prompt_length]
    forbidden_template_kwargs: [truncation, max_length]
    notes:
      - "프롬프트 절단 필드는 없지만 chat_template_kwargs의 truncation/max_length는 프롬프트를 자름 (docs/research/trl-grpo.md §9)."
      - "max_completion_length는 항상 유한한 completion budget 정수로 내보냄 (None은 20 token 기본값으로 바뀜)."
sources:
  - docs/research/trl-sft-dpo.md
  - docs/research/trl-grpo.md
  - docs/research/loading-quantization-peft.md
  - docs/research/architecture-memory.md
