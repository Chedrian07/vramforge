[project]
name = "vramforge-estimator"
version = "0.1.0"
description = "VRAMForge calculation core: sources, inspection, preprocessing, scan, batching, memory model"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.13,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Everything needed to inspect real sources and tokenize full datasets on CPU.
# transformers is used for tokenizers/chat templates only — torch is intentionally NOT a dependency.
# Versions are pinned to the training-environment profile so tokenization matches the trainer.
analysis = [
    "huggingface_hub>=1.33,<2",
    "transformers==5.18.0",
    "tokenizers==0.23.2",
    "datasets==5.0.1",
    "pyarrow>=25",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vramforge_estimator"]
